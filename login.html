<!DOCTYPE html>
<html>
<head>
    <title>CampusConnect 2026 - Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 70px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #1a73e8;
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            font-size: 16px;
        }

        .register {
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>CampusConnect 2026</h1>

    <h2>STUDENT LOGIN</h2>

    <form action="login.php" method="POST">

        <label>Email / Student ID</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <input type="submit" value="LOGIN">

    </form>

    <div class="register">
        <p>New Student?</p>
        <a href="register.html">Register Here</a>
    </div>

</div>

</body>
</html>
